<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>基岩版钢琴模组生成器</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="https://unpkg.com/@tonejs/midi"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/crc-32@1.2.2/crc32.min.js"></script>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="bg-gray-100 flex flex-col">
        <!-- 加载层 -->
        <div id="loading" class="loading-overlay">
            <div class="loader"></div>
            <p id="loadingText" class="mt-4 text-blue-600 font-bold">
                处理中...
            </p>
        </div>

        <!-- 更新日志弹窗 -->
        <div id="logModal" class="modal-overlay shadow-2xl">
            <div
                class="modal-content max-w-lg w-full bg-white rounded-3xl p-6 md:p-8 mx-4"
            >
                <div
                    class="flex justify-between items-center mb-6 border-b pb-4"
                >
                    <h2
                        class="text-xl font-black text-gray-800 uppercase italic tracking-tighter"
                    >
                        更新日志
                    </h2>
                    <button
                        onclick="closeLog()"
                        class="text-gray-400 hover:text-gray-800 transition-colors"
                    >
                        <svg
                            class="w-6 h-6"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"
                            ></path>
                        </svg>
                    </button>
                </div>
                <div
                    id="logBody"
                    class="space-y-6 max-h-[50vh] overflow-y-auto custom-scrollbar pr-2 text-sm text-gray-600"
                >
                    加载中...
                </div>
            </div>
        </div>

        <!-- 头部 -->
        <header
            class="bg-white border-b border-gray-200 px-4 md:px-8 py-3 flex justify-between items-center shadow-sm shrink-0 z-10"
        >
            <div class="flex items-center gap-3">
                <div
                    class="bg-blue-600 p-2 rounded-lg shrink-0 shadow-lg shadow-blue-100"
                >
                    <svg
                        class="w-5 h-5 text-white"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
                        ></path>
                    </svg>
                </div>
                <h1
                    class="text-base md:text-lg font-black text-gray-800 tracking-tighter uppercase truncate"
                >
                    钢琴模组生成器
                </h1>
            </div>
            <div class="flex items-center gap-2 md:gap-4">
                <button
                    onclick="openLog()"
                    class="text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full hover:bg-blue-100 transition"
                >
                    更新日志
                </button>
                <button
                    id="generateBtn"
                    disabled
                    class="px-5 md:px-8 py-2 bg-blue-600 text-white rounded-lg font-black text-xs md:text-sm shadow-md hover:bg-blue-700 disabled:bg-gray-300 transition-all"
                >
                    导出包
                </button>
            </div>
        </header>

        <!-- 主容器 -->
        <div
            class="flex-1 flex flex-col overflow-hidden overflow-y-auto lg:overflow-hidden"
        >
            <div
                class="max-w-7xl w-full mx-auto p-4 md:p-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 main-grid overflow-hidden"
            >
                <!-- 左侧：设置 -->
                <aside
                    class="lg:col-span-4 space-y-6 lg:overflow-y-auto custom-scrollbar pr-1"
                >
                    <section
                        class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200"
                    >
                        <h3
                            class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2"
                        >
                            <span
                                class="w-1.5 h-4 bg-blue-500 rounded-full"
                            ></span>
                            导出配置
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label
                                    class="text-[10px] font-bold text-gray-400 mb-1 block uppercase font-mono"
                                    >Pack Name</label
                                >
                                <input
                                    type="text"
                                    id="addonName"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500"
                                />
                            </div>
                            <div>
                                <label
                                    class="text-[10px] font-bold text-gray-400 mb-1 block uppercase font-mono"
                                    >Description</label
                                >
                                <textarea
                                    id="addonDesc"
                                    rows="2"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500"
                                ></textarea>
                            </div>
                            <div
                                class="flex items-center justify-between p-3 bg-blue-50/50 rounded-xl border border-blue-100"
                            >
                                <span class="text-xs font-bold text-blue-800"
                                    >随机化 UUID</span
                                >
                                <label
                                    class="relative inline-flex items-center cursor-pointer"
                                >
                                    <input
                                        type="checkbox"
                                        id="randomUuid"
                                        checked
                                        class="sr-only peer"
                                    />
                                    <div
                                        class="w-10 h-5 bg-gray-200 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"
                                    ></div>
                                </label>
                            </div>
                        </div>
                    </section>

                    <section
                        class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200"
                    >
                        <h3
                            class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2"
                        >
                            <span
                                class="w-1.5 h-4 bg-orange-400 rounded-full"
                            ></span>
                            模板底包状态
                        </h3>
                        <div
                            class="space-y-3 mb-5 p-4 bg-orange-50/50 rounded-xl border border-orange-100 text-[11px]"
                        >
                            <div class="flex justify-between font-bold">
                                <span class="text-gray-400 uppercase"
                                    >底包版本</span
                                ><span
                                    id="tplVersion"
                                    class="text-orange-700 font-mono italic"
                                    >未加载</span
                                >
                            </div>
                            <div
                                class="flex flex-col gap-1 font-bold pt-2 border-t border-orange-100"
                            >
                                <span class="text-gray-400 uppercase text-[9px]"
                                    >原始描述</span
                                ><span
                                    id="tplDescDisplay"
                                    class="text-gray-600 italic leading-relaxed"
                                    >等待解析...</span
                                >
                            </div>
                        </div>
                        <label class="block">
                            <span
                                class="text-[10px] font-bold text-gray-400 mb-2 block uppercase text-center"
                                >更换底包模板 (.mcaddon)</span
                            >
                            <input
                                type="file"
                                id="templateInput"
                                accept=".mcaddon,.zip"
                                class="block w-full text-xs text-gray-500 file:mr-3 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-gray-100 file:text-gray-600 hover:file:bg-gray-200 cursor-pointer"
                            />
                        </label>
                    </section>
                </aside>

                <!-- 右侧：管理 -->
                <main
                    class="lg:col-span-8 flex flex-col gap-6 min-h-0 overflow-hidden"
                >
                    <section
                        class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 shrink-0"
                    >
                        <div
                            class="flex flex-col md:flex-row justify-between items-center gap-4"
                        >
                            <div class="text-center md:text-left">
                                <h3
                                    class="text-sm font-black text-gray-800 uppercase italic tracking-tighter"
                                >
                                    MIDI音乐导入
                                </h3>
                                <p
                                    class="text-[10px] text-gray-400 uppercase font-mono"
                                >
                                    批量导入 MIDI 自动生成脚本
                                </p>
                            </div>
                            <label
                                class="w-full md:w-auto px-10 py-3 bg-blue-600 text-white rounded-xl text-sm font-black cursor-pointer hover:bg-blue-700 transition shadow-lg shadow-blue-100 text-center"
                            >
                                选择 MIDI 文件
                                <input
                                    type="file"
                                    id="midiInput"
                                    multiple
                                    accept=".mid,.midi"
                                    class="hidden"
                                />
                            </label>
                        </div>
                    </section>

                    <section
                        class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col flex-1 min-h-0 overflow-hidden"
                    >
                        <div
                            class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/30"
                        >
                            <span
                                class="text-xs font-black text-gray-500 uppercase tracking-widest leading-none"
                                >曲目列表 (<span id="count">0</span>)</span
                            >
                            <button
                                id="clearBtn"
                                class="text-[10px] font-black text-red-400 hover:text-red-600 uppercase transition-colors"
                            >
                                清空列表
                            </button>
                        </div>
                        <div
                            id="midiList"
                            class="flex-1 overflow-y-auto divide-y divide-gray-50 custom-scrollbar"
                        ></div>
                    </section>
                </main>
            </div>
        </div>

        <!-- 页脚 -->
        <footer
            class="bg-white border-t border-gray-200 px-6 py-4 shrink-0 z-20"
        >
            <div
                class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4"
            >
                <p
                    class="text-[10px] text-gray-400 font-bold uppercase tracking-widest font-mono italic"
                >
                    © 2026 Piano Factory
                </p>
                <div class="flex items-center gap-8">
                    <a
                        href="https://github.com/XiaoYangx666/pianoBE"
                        target="_blank"
                        class="flex items-center gap-2 text-gray-400 hover:text-gray-900 transition"
                    >
                        <svg
                            class="w-5 h-5"
                            fill="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
                            />
                        </svg>
                        <span
                            class="text-[10px] font-black uppercase tracking-widest"
                            >GitHub</span
                        >
                    </a>
                    <a
                        href="https://www.bilibili.com/video/BV1jLD9BzE5D/"
                        target="_blank"
                        class="flex items-center gap-2 text-gray-400 hover:text-[#fb7299] transition"
                    >
                        <svg
                            class="w-5 h-5"
                            fill="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M17.813 4.653h-.854l1.547-2.32a.746.746 0 00-.013-.828.73.73 0 00-.612-.313.73.73 0 00-.622.316L14.75 5.332h-5.594L6.65 1.508a.73.73 0 00-1.234.003.746.746 0 00-.012.828l1.547 2.314h-.854a3.754 3.754 0 00-3.75 3.75v7.5a3.754 3.754 0 003.75 3.75h11.266a3.754 3.754 0 003.75-3.75v-7.5a3.754 3.754 0 00-3.75-3.75zm-11.194 9a1.584 1.584 0 01-1.5-1.5 1.584 1.584 0 011.5-1.5 1.584 1.584 0 011.5 1.5 1.584 1.584 0 01-1.5 1.5zm8.194 0a1.584 1.584 0 01-1.5-1.5 1.584 1.584 0 011.5-1.5 1.584 1.584 0 011.5 1.5 1.584 1.584 0 01-1.5 1.5z"
                            />
                        </svg>
                        <span
                            class="text-[10px] font-black uppercase tracking-widest"
                            >Bilibili</span
                        >
                    </a>
                </div>
            </div>
        </footer>

        <script src="app.js"></script>
    </body>
</html>
