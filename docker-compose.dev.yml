# 开发配置：直接挂载本地代码与构建产物，改代码即生效（无需重建镜像）。
# 先运行 npm run build:release，再运行 docker compose -f docker-compose.dev.yml up --build。
services:
    server:
        image: pianobe-server:latest
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "35050:3000"
        environment:
            BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
            DB_PATH: /app/data/piano.db
            LOG_FILE: /app/data/logs/server.log
            LOG_LEVEL: ${LOG_LEVEL:-info}
            LOG_FORMAT: ${LOG_FORMAT:-text}
            LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
            LOG_MAX_FILES: ${LOG_MAX_FILES:-7}
            WEB_ROOT: /app/packages/studio/dist
            BUILTIN_PLUGINS_DIR: /app/build/plugins
            ALLOW_PUBLIC_READ: ${ALLOW_PUBLIC_READ:-false}
        volumes:
            # 本地源码热重载（bun --watch）
            - ./packages/server/src:/app/packages/server/src
            - ./packages/vfx/src:/app/packages/vfx/src
            - ./packages/assembly/src:/app/packages/assembly/src
            # 本地构建产物（改 core/vfx/assembly/studio 后 npm run build:* 生效）
            - ./packages/core/dist:/app/packages/core/dist
            - ./packages/vfx/dist:/app/packages/vfx/dist
            - ./packages/assembly/dist:/app/packages/assembly/dist
            - ./packages/studio/dist:/app/packages/studio/dist
            - ./build/plugins:/app/build/plugins
            # 数据持久化
            - ./packages/server/data:/app/data
        command: ["bun", "--watch", "src/index.ts"]
        restart: unless-stopped
