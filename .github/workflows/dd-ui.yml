name: DDUI regression

on:
  push:
    branches:
      - main
      - overhaul
    paths:
      - ".github/workflows/dd-ui.yml"
      - "packages/addon/src/**"
      - "packages/addon/tests/**"
      - "packages/addon/tsconfig.json"
      - "packages/addon/bunfig.toml"
      - "packages/core/**"
      - "packages/addon/package.json"
      - "package-lock.json"
      - "packages/vfx/**"
  pull_request:
    paths:
      - ".github/workflows/dd-ui.yml"
      - "packages/addon/src/**"
      - "packages/addon/tests/**"
      - "packages/addon/tsconfig.json"
      - "packages/addon/bunfig.toml"
      - "packages/core/**"
      - "packages/addon/package.json"
      - "package-lock.json"
      - "packages/vfx/**"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Ensure obsolete PianoViewModel is absent
        run: |
          if git grep -n -E 'PianoViewModel|pianoViewModel\(' -- packages/addon/src; then
            exit 1
          fi
      - name: Run regressions
        run: |
          npm run test:vfx
          npm run test:addon -- tests/architecture.test.ts tests/pianoPanel.test.ts tests/pianoSettingsUI.test.ts tests/midiPlayerUI.test.ts
