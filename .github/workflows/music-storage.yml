name: Music storage regression

on:
  push:
    branches:
      - main
      - overhaul
    paths:
      - ".github/workflows/music-storage.yml"
      - "packages/addon/src/**"
      - "packages/addon/tests/**"
      - "packages/core/src/**"
      - "packages/addon/package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/music-storage.yml"
      - "packages/addon/src/**"
      - "packages/addon/tests/**"
      - "packages/core/src/**"
      - "packages/addon/package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Ensure obsolete PianoViewModel is absent
        run: |
          if git grep -n -E 'PianoViewModel|pianoViewModel\(' -- packages/addon/src; then
            exit 1
          fi
      - name: Run regressions
        run: |
          npm run test:core
          npm run test:addon -- tests/musicStorage.test.ts tests/cardSlot.test.ts tests/musicRefs.test.ts tests/musicUI.test.ts
