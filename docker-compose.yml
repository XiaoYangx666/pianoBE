services:
    server:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "35050:3000"
        environment:
            # 管理员令牌：部署时务必修改！忘记可在 .env 中修改后重启容器重置
            BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-change-me-admin-token}
            DB_PATH: /app/data/piano.db
            MIDIS_DIR: /app/data/midis
            WEB_ROOT: /app/packages/web/dist
            # 需要公开读时设为 true
            ALLOW_PUBLIC_READ: ${ALLOW_PUBLIC_READ:-false}
        volumes:
            - ./packages/server/data:/app/data
        restart: unless-stopped
