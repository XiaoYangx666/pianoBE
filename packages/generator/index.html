<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Crect x='4' y='12' width='24' height='16' rx='2' fill='white'/%3E%3Cpath d='M9 16v9M14 16v9M19 16v9M24 16v9' stroke='%231f2430' stroke-width='2.4'/%3E%3C/svg%3E" />
        <title>基岩版钢琴模组生成器</title>
    </head>
    <body>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p id="loadingText">处理中...</p>
        </div>

        <header>
            <h1>钢琴模组生成器</h1>
            <button id="generateBtn" disabled>导出包</button>
        </header>

        <main>
            <aside class="panel">
                <h3>导出配置</h3>
                <label>Pack Name</label>
                <input type="text" id="addonName" placeholder="钢琴附加包" />
                <label>Description</label>
                <textarea id="addonDesc" rows="2"></textarea>
                <label class="check">
                    <input type="checkbox" id="randomUuid" checked />
                    随机化 UUID
                </label>

                <h3>模板底包状态</h3>
                <div class="tpl-box">
                    <div>
                        <span>底包版本</span>
                        <b id="tplVersion">未加载</b>
                    </div>
                    <div>
                        <span>原始描述</span>
                        <i id="tplDesc">等待解析...</i>
                    </div>
                </div>
                <label class="file-btn">
                    更换底包模板 (.mcaddon)
                    <input type="file" id="templateInput" accept=".mcaddon,.zip" hidden />
                </label>
            </aside>

            <section class="panel main-panel">
                <div class="import-row">
                    <div>
                        <h3>MIDI 音乐导入</h3>
                        <p>批量导入 MIDI，自动内嵌为 addon 脚本</p>
                    </div>
                    <div class="import-actions">
                        <button id="openLibBtn" class="file-btn">MIDI 曲库</button>
                        <label class="file-btn primary">
                            选择 MIDI 文件
                            <input type="file" id="midiInput" multiple accept=".mid,.midi" hidden />
                        </label>
                    </div>
                </div>

                <div class="list-head">
                    <span>曲目列表 (<span id="count">0</span>)</span>
                    <button id="clearBtn" class="text-danger">清空列表</button>
                </div>
                <div id="midiList" class="midi-list"></div>
            </section>
        </main>

        <!-- MIDI 曲库弹窗 -->
        <div id="libModal" class="modal-overlay" hidden>
            <div class="modal">
                <div class="modal-head">
                    <h3>MIDI 曲库 <span class="lib-sub">（<span id="libCount">0</span> 首 · 试听音色取自底包模板）</span></h3>
                    <button id="libClose" class="modal-close" title="关闭"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                </div>
                <input type="text" id="libSearch" placeholder="搜索曲名 / ID…" />
                <div id="libList" class="midi-list lib-list"></div>
            </div>
        </div>

        <footer>© PianoBE · 转换与打包逻辑由 @piano/core 提供</footer>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
