<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Crect x='4' y='12' width='24' height='16' rx='2' fill='white'/%3E%3Cpath d='M9 16v9M14 16v9M19 16v9M24 16v9' stroke='%231f2430' stroke-width='2.4'/%3E%3C/svg%3E" />
        <title>基岩版钢琴模组生成器</title>
    </head>
    <body>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p id="loadingText">处理中...</p>
        </div>

        <header>
            <h1>钢琴模组生成器</h1>
            <div class="header-actions">
                <button id="openLogBtn" class="log-btn">更新日志</button>
                <button id="generateBtn" disabled>导出包</button>
            </div>
        </header>

        <main>
            <aside class="panel">
                <h3>导出配置</h3>
                <label>Pack Name</label>
                <input type="text" id="addonName" placeholder="钢琴附加包" />
                <label>Description</label>
                <textarea id="addonDesc" rows="2"></textarea>
                <label class="check">
                    <input type="checkbox" id="randomUuid" checked />
                    随机化 UUID
                </label>

                <h3>模板底包状态</h3>
                <div class="tpl-box">
                    <div>
                        <span>底包版本</span>
                        <b id="tplVersion">未加载</b>
                    </div>
                    <div>
                        <span>原始描述</span>
                        <i id="tplDesc">等待解析...</i>
                    </div>
                </div>
                <label class="file-btn">
                    更换底包模板 (.mcaddon)
                    <input type="file" id="templateInput" accept=".mcaddon,.zip" hidden />
                </label>
            </aside>

            <section class="panel main-panel">
                <div class="import-row">
                    <div>
                        <h3>MIDI 音乐导入</h3>
                        <p>批量导入 MIDI，自动内嵌为 addon 脚本</p>
                    </div>
                    <div class="import-actions">
                        <button id="openLibBtn" class="file-btn">MIDI 曲库</button>
                        <label class="file-btn primary">
                            选择 MIDI 文件
                            <input type="file" id="midiInput" multiple accept=".mid,.midi" hidden />
                        </label>
                    </div>
                </div>

                <div class="list-head">
                    <span>曲目列表 (<span id="count">0</span>)</span>
                    <button id="clearBtn" class="text-danger">清空列表</button>
                </div>
                <div id="midiList" class="midi-list"></div>
            </section>
        </main>

        <!-- MIDI 曲库弹窗 -->
        <div id="libModal" class="modal-overlay" hidden>
            <div class="modal">
                <div class="modal-head">
                    <h3>MIDI 曲库 <span class="lib-sub">（<span id="libCount">0</span> 首 · 试听音色取自底包模板）</span></h3>
                    <button id="libClose" class="modal-close" title="关闭"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                </div>
                <input type="text" id="libSearch" placeholder="搜索曲名 / ID…" />
                <div id="libList" class="midi-list lib-list"></div>
                <p class="lib-notice">曲库内歌曲仅供学习交流使用，版权归原著作权人所有；如涉及侵权，请联系我们删除。</p>
            </div>
        </div>

        <!-- 更新日志弹窗 -->
        <div id="logModal" class="modal-overlay" hidden>
            <div class="modal">
                <div class="modal-head">
                    <h3>更新日志</h3>
                    <button id="logClose" class="modal-close" title="关闭"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                </div>
                <div class="log-tabs">
                    <button class="log-tab on" data-tab="project">项目更新日志</button>
                    <button class="log-tab" data-tab="addon">模板包更新日志</button>
                </div>
                <div id="logList" class="log-list"></div>
            </div>
        </div>

        <footer>
            <div class="footer-links">
                <a href="https://www.bilibili.com/video/BV1jLD9BzE5D/" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M7.2 3.6L5.6 1.2M16.8 3.6l1.6-2.4"/><rect x="2" y="5" width="20" height="15" rx="3.5"/><path d="M10 9.8v5.4l4.6-2.7z"/></svg>
                    <span>Bilibili</span>
                </a>
                <a href="https://github.com/XiaoYangx666/pianoBE" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    <span>GitHub</span>
                </a>
            </div>
        </footer>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
