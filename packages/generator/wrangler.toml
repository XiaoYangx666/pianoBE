# 保持与历史部署同名，旧地址 pianobe.2408807389.workers.dev 不变；
# 如需新域名改这里即可
name = "pianobe"
compatibility_date = "2026-04-15"
main = "./worker/index.ts"

# 静态资源仍由 Workers Static Assets 直接服务；仅 /api/* 进入 Worker。
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "pianobe-stats"
database_id = "abe65c3f-37d3-4537-989c-0a70bd73c734"

# database_id 不是 secret，可以提交到仓库。
# 首次绑定后执行：
#   npx wrangler d1 migrations apply pianobe-stats --remote
#   npx wrangler secret put IP_HASH_SECRET
