services:
    server:
        build:
            context: ../..
            dockerfile: apps/server/Dockerfile
        ports:
            - "3000:3000"
        environment:
            # 管理员令牌：部署时务必修改！忘记可在 .env 中修改后重启容器重置
            BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-change-me-admin-token}
            PORT: "3000"
            DB_PATH: /app/data/piano.db
            WEB_ROOT: /app/apps/web/dist
            # 需要公开读时设为 true
            ALLOW_PUBLIC_READ: ${ALLOW_PUBLIC_READ:-false}
        volumes:
            - ./data:/app/data
        restart: unless-stopped